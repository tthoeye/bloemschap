<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Checkout (binnenkort) | Bloemschap</title>
    <style>
      :root {
        --ro-ink: #3f524c;
        --ro-primary: #5a7b5e;
        --ro-primary-2: #769f7a;
        --ro-bg: #e6efec;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial;
        background: radial-gradient(
            900px 600px at 20% 10%,
            rgba(118, 159, 122, 0.2),
            transparent 60%
          ),
          var(--ro-bg);
        color: var(--ro-ink);
        padding: 28px 16px;
      }

      .card {
        width: min(760px, 100%);
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(63, 82, 76, 0.12);

        padding: 22px;
        box-shadow: 0 18px 55px rgba(63, 82, 76, 0.18);
      }

      h1 {
        margin: 0 0 10px;
        font-size: 26px;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0 0 14px;
        line-height: 1.5;
        color: rgba(63, 82, 76, 0.85);
      }

      a {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        background: linear-gradient(180deg, var(--ro-primary-2), var(--ro-primary));
        color: #fff;
        border-radius: 999px;
        padding: 12px 16px;
        font-weight: 700;
        box-shadow: 0 12px 26px rgba(90, 123, 94, 0.28);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Checkout komt binnenkort</h1>
      <p>
        Dit is een tijdelijke pagina zodat de knop al kan doorsturen. De echte checkout
        bouwen we later.
      </p>
      <a href="index.html">Terug naar Bloemschap <span aria-hidden="true">←</span></a>
    </main>
  </body>
</html>
